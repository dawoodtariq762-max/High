<link rel="stylesheet" href="/assets/zoom-motion-off.css?v=zoom-20261026"/></head><body class="gx-light gx-portal-login"><div class="card"><div class="logo"><img data-brand-logo alt="ZOOM SMS" src="/assets/zoom-logo-transparent.png?v=zoom-20261025"></div><h1>Payment Panel</h1><div class="sub">Admin only — isolated payment management</div><form id="form"><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button>Login</button><div id="msg" class="msg"></div></form></div><script>function msg(t,c){const m=document.getElementById('msg');m.className='msg '+(c||'');m.textContent=t}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();msg('Checking...','ok');try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Login failed');if(data.user.role!=='admin')throw new Error('Payment Panel requires Admin account.');sessionStorage.setItem('ms_token',data.token);sessionStorage.setItem('ms_role',data.user.role);sessionStorage.setItem('ms_user',data.user.username);sessionStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_token',data.token);localStorage.setItem('ms_role',data.user.role);localStorage.setItem('ms_user',data.user.username);localStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_last_page_payment','dashboard');location.href='/payment';}catch(err){msg('❌ '+err.message,'err')}});</script></body></html>

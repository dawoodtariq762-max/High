<meta charset="UTF-8" />

<title>ZOOM SMS — Login</title>
<style>*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;font-family:Inter,Segoe UI,system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px;line-height:1.5;}
.shell{width:min(1060px,100%);display:grid;grid-template-columns:1.05fr .95fr;border:1px solid var(--border);border-radius:28px;overflow:hidden;}
.brand-panel{position:relative;padding:48px;min-height:640px;overflow:hidden;}
.brand-panel:before{content:"";position:absolute;width:360px;height:360px;border-radius:50%;right:-120px;top:-120px;}
.brand-panel:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;left:-80px;bottom:-80px;}
.brand-logo{position:relative;display:flex;align-items:center;gap:14px;margin-bottom:80px;}
.logo{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;}
.logo svg{width:32px;height:32px;stroke:#1d4ed8;}
.brand-logo h1{font-size:21px;letter-spacing:.05em;}
.brand-logo p{font-size:12px;margin-top:2px;text-transform:uppercase;letter-spacing:.12em;}
.hero{position:relative;max-width:520px;}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid #ddd;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800;margin-bottom:22px;}
.dot{width:8px;height:8px;border-radius:50%;}
.hero h2{font-size:clamp(38px,5vw,58px);line-height:1;letter-spacing:-.055em;margin-bottom:20px;}
.hero p{font-size:16px;line-height:1.8;}
.features{position:relative;display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:46px;}
.feature{border:1px solid #ddd;border-radius:18px;padding:16px;}
.feature b{display:block;font-size:14px;margin-bottom:5px;}
.feature span{font-size:12.5px;}
.login-panel{padding:46px;display:flex;align-items:center;justify-content:center;}
.login-card{width:100%;max-width:410px;}
.login-head{margin-bottom:28px;}
.login-head .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:900;margin-bottom:8px;}
.login-head h2{font-size:34px;letter-spacing:-.045em;margin-bottom:8px;}
.login-head p{font-size:14px;}
.field{margin-bottom:17px;}
.field label{display:block;font-size:13.5px;font-weight:800;margin-bottom:8px;}
.input-wrap{position:relative;}
.input-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#94a3b8;}
input{width:100%;border:1px solid var(--border2);border-radius:14px;padding:13px 14px 13px 43px;font-size:15px;outline:none;transition:.16s;}
.toggle-pass{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;border-radius:10px;padding:7px 9px;font-size:12px;font-weight:800;cursor:pointer;}
.pass-input{padding-right:72px;}
.captcha-row{display:grid;grid-template-columns:130px 1fr;gap:12px;}
.captcha-box{height:48px;border:1px dashed #ddd;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:18px;}
.refresh-btn{border:0;cursor:pointer;font-size:17px;}
.row-between{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px;font-size:13px;}
.checkbox{display:flex;align-items:center;gap:8px;cursor:pointer;}
.checkbox input{width:auto;padding:0;}
.row-between a{text-decoration:none;font-weight:800;}
.btn{width:100%;border:0;border-radius:15px;padding:14px;font-weight:900;font-size:15px;cursor:pointer;transition:.16s;}
.btn:hover{transform:translateY(-1px);}
.msg{margin-top:15px;border-radius:13px;padding:11px 13px;font-size:13.5px;display:none;}
.msg.show{display:block;}
.msg.error{border:1px solid #ddd;}
.msg.success{border:1px solid #ddd;}
.footer{text-align:center;font-size:12px;margin-top:24px;}
.sb-logo svg,.brand .logo svg,.rail .logo svg,.sb-brand .logo svg,.brand-logo .logo svg{stroke:#fff!important;}
.sb-brand h1,.brand h1,.brand-text h1,.brand-logo h1{font-weight:700!important;letter-spacing:-.01em!important;}
.feature{min-height:48px;display:flex;align-items:center;}
.feature b{font-size:13.5px!important;margin-bottom:0!important;}
.features{grid-template-columns:1fr!important;gap:10px!important;margin-top:34px!important;}
.qtech-sms-logo-img{width:100%!important;height:100%!important;object-fit:cover!important;display:block!important;border-radius:inherit!important;}
.sb-logo,.brand .logo,.rail .logo,.sb-brand .logo,.brand-logo .logo{padding:0!important;overflow:hidden!important;border:1px solid #ddd!important;}
.brand-logo .logo{width:92px!important;height:92px!important;border-radius:22px!important;margin-bottom:16px!important;}
.sb-logo{width:44px!important;height:44px!important;border-radius:13px!important;}
.brand .logo,.sb-brand .logo{width:46px!important;height:46px!important;border-radius:13px!important;}
.rail .logo{width:50px!important;height:50px!important;border-radius:14px!important;}
.brand-panel .brand-logo{align-items:flex-start!important;}
.brand-panel .brand-logo h1{font-size:24px!important;}
.brand-panel.logo-only-panel{padding:0!important;display:flex!important;align-items:center!important;justify-content:center!important;min-height:640px!important;overflow:hidden!important;}
.brand-panel.logo-only-panel::before,.brand-panel.logo-only-panel::after{display:none!important;}
.login-hero-logo{width:100%!important;height:100%!important;object-fit:contain!important;display:block!important;padding:26px!important;}
.m-brand{display:none;}
.login-card:before{content:none!important;}
@media(max-width:900px){.m-brand{display:flex!important;align-items:center;justify-content:center;gap:0;margin:0 0 8px;padding:0;border:0;}
.m-brand img{width:40px!important;height:40px!important;border-radius:11px;object-fit:cover;}
.m-brand-t{display:none!important;}
body{align-items:flex-start!important;padding:8px 12px 10px!important;overflow-x:hidden!important;}
.shell{display:block!important;width:100%!important;max-width:430px!important;margin:0 auto!important;min-height:0!important;}
.brand-panel,.brand-panel.logo-only-panel{display:none!important;}
.login-hero-logo{display:none!important;}
.login-panel{min-height:0!important;padding:12px 14px 10px!important;align-items:flex-start!important;}
.login-card{max-width:none!important;width:100%!important;}
.login-head{margin-bottom:8px!important;text-align:center;}
.login-head .eyebrow{display:none!important;}
.login-head h2{font-size:18px!important;margin-bottom:2px!important;}
.login-head p{display:none!important;}
.field{margin-bottom:9px!important;}
.field label{font-size:12px!important;margin-bottom:4px!important;}
.input-wrap input{height:42px!important;font-size:15px!important;border-radius:10px!important;padding-left:36px!important;}
.pass-input{padding-right:60px!important;}
.captcha-row{grid-template-columns:104px 1fr!important;gap:8px!important;}
.captcha-box{height:42px!important;font-size:15px!important;border-radius:10px!important;}
.row-between{margin:2px 0 8px!important;font-size:12px!important;}
.btn{height:44px!important;font-size:15px!important;border-radius:11px!important;}
.msg{font-size:12px!important;padding:9px 11px!important;margin-top:10px!important;}
.footer{display:none!important;}}
/* ==== Login CAPTCHA — ZOOM SMS branded (Part 1.1) ==== */
#captchaText{
  color:#0b1f3d!important;
  font-weight:900!important;
  font-size:18px!important;
  letter-spacing:.06em!important;
  font-variant-numeric:tabular-nums;
  text-shadow:0 1px 0 rgba(255,255,255,.6);
}
.captcha-box{
  background:linear-gradient(135deg,#f0f7ff 0%,#e8f0ff 100%)!important;
  border:1.5px dashed #b6ccec!important;
  border-radius:14px!important;
  box-shadow:0 2px 8px rgba(29,78,216,.08), inset 0 1px 0 rgba(255,255,255,.8)!important;
  color:#0b1f3d!important;
  gap:10px!important;
  padding:0 10px!important;
}
.refresh-btn{
  width:32px!important;height:32px!important;min-width:32px!important;
  border-radius:8px!important;
  background:#1d4ed8!important;
  color:#fff!important;
  border:1px solid #1d4ed8!important;
  display:inline-grid!important;place-items:center!important;
  cursor:pointer!important;
  transition:transform .18s ease, background .18s ease, box-shadow .18s ease!important;
  box-shadow:0 2px 8px rgba(29,78,216,.25)!important;
}
.refresh-btn:hover{background:#1e40af!important;transform:rotate(12deg) scale(1.06)!important;box-shadow:0 4px 12px rgba(29,78,216,.35)!important;}
.refresh-btn:active{transform:scale(.96)!important;}
.refresh-btn svg{width:16px;height:16px;stroke:#fff!important;display:block;}

<body class="gx-light gx-login">
  <main class="shell">
    <section class="brand-panel logo-only-panel" data-brand-aria="name" aria-label="ZOOM SMS branding">
      <img class="login-hero-logo" data-brand-logo src="/assets/zoom-logo-transparent.png?v=zoom-20261026" alt="ZOOM SMS" />
    </section>
    <section class="login-panel"><div class="login-card">
      <div class="m-brand"><img data-brand-logo src="/assets/zoom-logo-transparent.png?v=zoom-20261026" alt="ZOOM SMS" width="180" height="180"/><div class="m-brand-t"><b data-brand="login">ZOOM SMS</b><span>Intelligent Messaging Infrastructure</span></div></div>
      <div class="login-head"><div class="eyebrow"><span data-brand-replace="short">ZOOM Secure Access</span></div><h2><span data-brand-replace="name">Welcome to ZOOM SMS</span></h2></div>
      <form id="loginForm" autocomplete="off">
        <div class="field"><label for="username">Username</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><input type="text" id="username" placeholder="Enter username" required /></div></div>
        <div class="field"><label for="password">Password</label><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><input class="pass-input" type="password" id="password" placeholder="Enter password" required /><button type="button" class="toggle-pass" id="togglePass">Show</button></div></div>
        <div class="field"><label for="captcha">Math Captcha</label><div class="captcha-row"><div class="captcha-box"><span id="captchaText">? + ?</span><button type="button" class="refresh-btn" id="refreshCaptcha" title="Refresh CAPTCHA" aria-label="Refresh CAPTCHA"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 1-2.6 6.4 9 9 0 0 1-6.4 2.6"/><path d="M3 12a9 9 0 0 1 2.6-6.4A9 9 0 0 1 12 3"/><polyline points="16 8 21 12 16 16"/><polyline points="8 16 3 12 8 8"/></svg></button></div><div class="input-wrap"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg><input type="number" id="captcha" placeholder="Answer" required /></div></div></div>
        <div class="row-between"><label class="checkbox"><input type="checkbox" id="remember"/> Remember me</label><a href="#" onclick="return false;">Forgot password?</a></div>
        <button type="submit" class="btn">Sign In</button><div class="msg" id="msg"></div>
      </form>
      <div class="footer" data-brand="footer">© 2026 ZOOM SMS • Intelligent messaging infrastructure</div>
    </div></section>
  </main>
<script>
  let captchaAnswer = 0;
  function newCaptcha(){const a=Math.floor(Math.random()*9)+1,b=Math.floor(Math.random()*9)+1;captchaAnswer=a+b;document.getElementById('captchaText').textContent=a+' + '+b;document.getElementById('captcha').value='';}
  document.getElementById('refreshCaptcha').addEventListener('click', newCaptcha);newCaptcha();
  const passInput=document.getElementById('password'),togglePass=document.getElementById('togglePass');togglePass.addEventListener('click',()=>{if(passInput.type==='password'){passInput.type='text';togglePass.textContent='Hide';}else{passInput.type='password';togglePass.textContent='Show';}});
  function showMsg(text,type){const m=document.getElementById('msg');m.textContent=text;m.className='msg show '+type;}
  document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();const u=document.getElementById('username').value.trim(),p=document.getElementById('password').value,c=parseInt(document.getElementById('captcha').value,10);if(c!==captchaAnswer){showMsg('❌ Incorrect captcha answer. Please try again.','error');newCaptcha();return;}showMsg('⏳ Verifying...','success');fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})}).then(async r=>{const data=await r.json();if(!r.ok)throw new Error(data.error||'Login failed');return data;}).then(data=>{try{sessionStorage.clear();sessionStorage.setItem('ms_token',data.token);sessionStorage.setItem('ms_role',data.user.role);sessionStorage.setItem('ms_user',data.user.username);sessionStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_token',data.token);localStorage.setItem('ms_role',data.user.role);localStorage.setItem('ms_user',data.user.username);localStorage.setItem('ms_name',data.user.name||data.user.username);localStorage.setItem('ms_last_page_'+data.user.role,'dashboard');localStorage.removeItem('gx_chat_unlock_token');localStorage.removeItem('gx_agent_sec_unlocked');}catch(e){}showMsg('✅ Welcome '+(data.user.name||data.user.username)+'! Redirecting...','success');setTimeout(()=>{window.location.href='/' + data.user.role.toLowerCase();},550);}).catch(err=>{showMsg('❌ '+err.message,'error');newCaptcha();});});
</script>
</body>
</html>

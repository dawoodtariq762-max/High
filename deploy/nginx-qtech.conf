# ZOOM SMS — nginx reverse proxy (Phase-1 Step 6)
# Install: cp deploy/nginx-qtech.conf /etc/nginx/sites-available/qtech-sms
#          ln -s /etc/nginx/sites-available/qtech-sms /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
#
# Replace qtech-sms.example.com with your domain and 4000 with your PORT if changed.
# The backend itself must only listen on localhost:  PM2 env PORT=4000 + firewall (ufw deny 4000/tcp)

# EDGE RATE-LIMIT ZONE — must live OUTSIDE the server{} block (sites-enabled
# files are included inside http{}, so top-of-file here is http context).
limit_req_zone $binary_remote_addr zone=qtech_sms_api:10m rate=30r/s;

server {
    listen 80;
    server_name qtech-sms.example.com;

    # TLS (after certbot): certbot --nginx -d qtech-sms.example.com

    # Uploads (CSV import multipart)
    client_max_body_size 200m;

    # gzip: JSON responses ~70% smaller -> faster panels on slow links
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    # Basic abuse guard at the edge (backend has its own per-user limits too)

    location / {
        limit_req zone=qtech_sms_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Slow mobile clients are buffered here, not in Node:
        proxy_buffering on;
        proxy_buffers 16 16k;
    }

    # Internal/testing SMS ingest hook. The backend keeps it open by default (the project's
    # own harnesses and, historically, direct pushes use it). Two independent ways to lock it
    # down — enable either (or both):
    #   1) backend: set WEBHOOK_SECRET in the environment -> requests must send the secret
    #      (header "x-webhook-secret", ?secret=... or a "secret" body field).
    #   2) edge: uncomment the block below to refuse the path from the internet entirely.
    #      Do this only after confirming nothing outside the host posts to it; the carrier
    #      HTTP ingress path is /api/incoming-sms, not this one.
    # location = /api/webhook/sms { return 403; }

    # Large generated export files (Phase-2) served by nginx via X-Accel-Redirect:
    # location /protected-exports/ { internal; alias /var/tmp/qtech-exports/; }
}
